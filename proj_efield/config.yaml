CAUSAL:

  # rename xxx_out.txt to xxx.txt
  renametxt: [ _out.txt, .txt]


  # set the default jarfile path for causal_cmd
  cmdpath: /home/limko/public/causal
  # auto select causal path based on hostname
  jarautopath:
    # MSI agate node
    "acn": /home/limko/public/causal
    # macbook
    "XJ75": /Users/kolim/bin
    # VA
    "resch4": /home/train/causal-bin


  causal-cmd:
    alpha: 0.05
    algorithm: gfci
    dataset: 
    data-type: continuous
    delimiter: comma
    json-graph: False
    #knowledge: prior.txt
    out: output_gfci
    penaltyDiscount: 1.0
    prefix:
    score: sem-bic-score
    #skip-latest: True
    test: fisher-z-test
    #thread: 1
    version: 1.11.1

  causal-cmd_1.8.0:
    alpha: 0.05
    algorithm: gfci
    dataset: 
    data-type: continuous
    delimiter: comma
    json-graph: False
    knowledge: prior.txt
    out: output_gfci
    penaltyDiscount: 1.0
    prefix:
    score: sem-bic-score
    #skip-latest: True
    test: fisher-z-test
    #thread: 1
    version: 1.8.0
 

  # 1.1.3
  causal-cmd_1.1.3:
    alpha: 0.05
    algorithm: gfci
    dataset: 
    data-type: continuous
    delimiter: comma
    json-graph: False
    knowledge: prior.txt
    out: output_gfci
    penaltyDiscount: 1.0
    prefix:
    score: sem-bic
    skip-latest: True
    test: fisher-z-test
    thread: 1
    version: 1.1.3
    #cmdpath: /home/limko/public/causal
    cmdpath: /home/train/causal-bin

  # standardize the columns
  standardize_cols: true

SEM:
  plotting:
    plot_all_edges: True   # default is False
    fontname: Helvetica
    label_edge_types: [-->, o-> , o-o ]
    min_pvalue: 1
    show_pvalue: True
    label: True

  # type of edges to include in model
  include_model_edges: [ ['-->','~'], ['o->', '~'] ]

GRAPHS:
  # additional graphs

  # settings for graphviz
  - op: graphviz
    arg:
      - node, shape=square
      - node, color=red

  -
    op: ancestors
    arg: 
      nodes: [binge,vomit]
      colors: 
        pos: green
        neg: red

  -
    op: save_plot
    arg: 
      stub: _ancest.png
      dir: output


check:
  # condition - to not include 'all_cases'
  condition: "id != 'all_cases'"

